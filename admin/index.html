<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Mirsad</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/app.css?v=2">
</head>
<body>
<header class="top">
  <a class="logo" href="../index.html"><img src="../img/mirsad-logo.png" alt="" width="30" height="30"><span>MIRSAD ADMIN</span></a>
  <nav><a href="../app/">My account</a><button id="signout" class="link" hidden>Sign out</button></nav>
</header>
<main>
  <div id="loading" class="center muted">Loading…</div>

  <section id="login" class="card narrow" hidden>
    <h2>Admin sign in</h2>
    <form id="f-login" class="form">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p id="login-msg" class="msg" role="status"></p>
  </section>

  <section id="denied" class="card narrow" hidden>
    <h2>No access</h2>
    <p class="muted">This account isn't an admin. <a href="../app/">Go to your account</a>.</p>
  </section>

  <section id="panel" hidden>
    <h1>Subscribers</h1>
    <div class="stats">
      <div class="card"><b id="s-users">0</b><span>Accounts</span></div>
      <div class="card"><b id="s-active">0</b><span>Paying (active)</span></div>
      <div class="card"><b id="s-mrr">$0</b><span>Monthly recurring revenue</span></div>
      <div class="card"><b id="s-due">0</b><span>Renewing in next 7 days</span></div>
    </div>
    <div class="card">
      <div class="row-between">
        <input id="q" type="search" placeholder="Search name, email, phone or country" style="flex:1;min-width:220px">
        <select id="filter" style="font:inherit;color:var(--ink);background:#060A1C;border:1px solid var(--line);border-radius:10px;padding:11px">
          <option value="">All</option><option value="paying">Paying</option><option value="free">Free</option><option value="problem">Payment problem</option><option value="cancelling">Cancelling</option>
        </select>
        <button class="btn ghost" id="export">Export CSV</button>
        <button class="btn ghost" id="refresh">Refresh</button>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Country</th><th>Plan</th><th>Billing</th><th>Status</th><th>Next payment</th><th>Amount</th><th>Joined</th><th>Stripe</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <p id="count" class="small muted"></p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../app/config.js"></script>
<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const show = (el, on = true) => { el.hidden = !on; };
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
  const money = (a, c) => a == null ? "—" : new Intl.NumberFormat("en", { style: "currency", currency: (c || "usd").toUpperCase() }).format(a / 100);
  const paying = (r) => ["active", "trialing", "past_due"].includes(r.status);
  let all = [];

  $("#f-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
    if (error) $("#login-msg").textContent = "Email or password is not right.";
  });
  $("#signout").addEventListener("click", () => sb.auth.signOut());
  $("#refresh").addEventListener("click", load);
  $("#q").addEventListener("input", render);
  $("#filter").addEventListener("change", render);

  function filtered() {
    const q = $("#q").value.trim().toLowerCase(), f = $("#filter").value;
    return all.filter((r) => {
      if (q && ![r.full_name, r.email, r.phone, r.country].some((v) => (v || "").toLowerCase().includes(q))) return false;
      if (f === "paying") return paying(r);
      if (f === "free") return !paying(r);
      if (f === "problem") return ["past_due", "unpaid", "incomplete"].includes(r.status);
      if (f === "cancelling") return r.cancel_at_period_end && paying(r);
      return true;
    });
  }

  function render() {
    const rows = filtered();
    $("#rows").innerHTML = rows.map((r) => `<tr>
      <td>${esc(r.full_name) || "—"}</td><td>${esc(r.email)}</td><td>${esc(r.phone) || "—"}</td><td>${esc(r.country) || "—"}</td>
      <td>${r.plan ? esc(r.plan[0].toUpperCase() + r.plan.slice(1)) : "Free"}</td>
      <td>${r.billing_interval === "year" ? "Yearly" : r.billing_interval === "month" ? "Monthly" : "—"}</td>
      <td>${r.status ? `<span class="st ${esc(r.status)}">${esc(r.status.replace("_", " "))}${r.cancel_at_period_end && paying(r) ? " (cancelling)" : ""}</span>` : "—"}</td>
      <td>${paying(r) && !r.cancel_at_period_end ? fmtDate(r.current_period_end) : "—"}</td>
      <td>${paying(r) ? money(r.amount, r.currency) : "—"}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${r.stripe_customer_id ? `<a href="https://dashboard.stripe.com/customers/${esc(r.stripe_customer_id)}" target="_blank" rel="noopener">Open</a>` : "—"}</td>
    </tr>`).join("") || `<tr><td colspan="11" class="muted">No matching accounts.</td></tr>`;
    $("#count").textContent = `${rows.length} of ${all.length} accounts`;
  }

  function stats() {
    const act = all.filter((r) => r.status === "active" || r.status === "trialing");
    // MRR in USD-equivalent cents: yearly plans divided by 12. AED converted at the fixed peg.
    const toUsd = (a, c) => (c || "usd").toLowerCase() === "aed" ? a / 3.6725 : a;
    const mrr = act.reduce((s, r) => s + toUsd(r.amount || 0, r.currency) / (r.billing_interval === "year" ? 12 : 1), 0);
    const week = Date.now() + 7 * 864e5;
    $("#s-users").textContent = all.length;
    $("#s-active").textContent = act.length;
    $("#s-mrr").textContent = money(Math.round(mrr), "usd");
    $("#s-due").textContent = act.filter((r) => !r.cancel_at_period_end && r.current_period_end && new Date(r.current_period_end) <= week).length;
  }

  $("#export").addEventListener("click", () => {
    const cols = ["full_name", "email", "phone", "country", "city", "plan", "billing_interval", "status", "cancel_at_period_end", "current_period_end", "amount", "currency", "created_at", "stripe_customer_id"];
    const csv = [cols.join(",")].concat(filtered().map((r) => cols.map((c) => `"${String(c === "amount" && r.amount != null ? r.amount / 100 : r[c] ?? "").replace(/"/g, '""')}"`).join(","))).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `mirsad-subscribers-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  });

  async function load() {
    const { data, error } = await sb.from("admin_users").select("*").order("created_at", { ascending: false });
    if (error) { $("#count").textContent = "Couldn't load accounts: " + error.message; return; }
    all = data || []; stats(); render();
  }

  async function route() {
    const { data: { session } } = await sb.auth.getSession();
    show($("#loading"), false);
    show($("#signout"), !!session);
    if (!session) { show($("#panel"), false); show($("#denied"), false); show($("#login"), true); return; }
    show($("#login"), false);
    const { data: isAdmin } = await sb.rpc("is_admin");
    if (!isAdmin) { show($("#denied"), true); show($("#panel"), false); return; }
    show($("#denied"), false); show($("#panel"), true);
    load();
  }
  sb.auth.onAuthStateChange((ev) => { if (["SIGNED_IN", "SIGNED_OUT"].includes(ev)) setTimeout(route, 0); });
  route();
})();
</script>
</body></html>
